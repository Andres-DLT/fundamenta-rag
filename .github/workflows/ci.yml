name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev,claude]"

      - name: Análisis estático
        run: |
          ruff check .
          ruff format --check .

      - name: Pruebas
        run: pytest -m "not semantic"

  integration:
    name: Integración (modelo de embeddings y cuadernos)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias (PyTorch para CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,semantic,claude,onnx]"

      - name: Caché del modelo de embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small

      - name: Pruebas completas
        run: pytest

      - name: Ejecutar cuadernos
        run: pytest --nbmake modulos/

      - name: Evaluación de recuperación
        run: fundamenta eval --embedder semantic

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t fundamenta .

      - name: Arrancar y comprobar
        run: |
          docker run -d --name fundamenta -p 7860:7860 -e FUNDAMENTA_PASSWORD=ci fundamenta
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7860/api/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/)" = "401"
          curl -sf -u visitante:ci -H "Content-Type: application/json" \
            -d '{"question": "¿Cuántos días de vacaciones tengo?"}' \
            http://127.0.0.1:7860/api/ask | grep -q "23 días laborables"

      - name: Registro del contenedor
        if: always()
        run: docker logs fundamenta || true

  render:
    name: Configuración ligera (Render)
    runs-on: ubuntu-latest
    env:
      FUNDAMENTA_EMBEDDER: onnx
      FUNDAMENTA_PASSWORD: ci
      PORT: "7860"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Construir como Render (sin PyTorch)
        run: |
          pip install ".[onnx]"
          fundamenta search "vacaciones" --k 1 > /dev/null
          ! pip show torch

      - name: Evaluación de recuperación
        run: fundamenta eval --embedder onnx

      - name: Arrancar y comprobar memoria
        run: |
          fundamenta serve --host 0.0.0.0 --port "$PORT" &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7860/api/health && break; sleep 2; done
          curl -sf -u visitante:ci -H "Content-Type: application/json" \
            -d '{"question": "¿Cuánto tiempo libre me dan al año?"}' \
            http://127.0.0.1:7860/api/ask | grep -q "23 días laborables"
          rss=$(ps -o rss= -p "$(pgrep -f 'fundamenta serve')")
          echo "Memoria en uso: $((rss / 1024)) MB"
          test "$rss" -lt 450000
