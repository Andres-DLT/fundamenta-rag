name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev,claude]"

      - name: Análisis estático
        run: |
          ruff check .
          ruff format --check .

      - name: Pruebas
        run: pytest -m "not semantic"

  integration:
    name: Integración (modelo de embeddings y cuadernos)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias (PyTorch para CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,semantic,claude]"

      - name: Caché del modelo de embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small

      - name: Pruebas completas
        run: pytest

      - name: Ejecutar cuadernos
        run: pytest --nbmake modulos/

      - name: Evaluación de recuperación
        run: fundamenta eval --embedder semantic
