[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fundamenta"
version = "1.1.0"
description = "Motor RAG construido desde cero: respuestas fundamentadas en la documentación de su organización, con citas verificables."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Andrés de la Torre Flores" }]
keywords = ["rag", "llm", "embeddings", "bm25", "retrieval", "knowledge-base", "search"]
dependencies = [
    "numpy>=1.26",  # álgebra vectorial (módulos 04 y 05)
    "pypdf>=4.0",   # lectura de PDF (módulo 01)
]

[project.optional-dependencies]
# Embeddings semánticos con un modelo multilingüe local (módulo 04)
semantic = ["sentence-transformers>=3.0"]
# El mismo modelo cuantizado y sin PyTorch, para servidores con poca memoria
onnx = ["onnxruntime>=1.18", "sentencepiece>=0.2", "huggingface_hub>=0.23"]
# Generación con Claude, de Anthropic (módulo 07)
claude = ["anthropic>=2.3"]
notebooks = ["jupyterlab>=4.0"]
# Despliegue en Hugging Face Spaces (scripts/deploy_huggingface.py)
deploy = ["huggingface_hub>=1.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "nbmake>=1.5",
    "ipykernel>=6.29",
]
all = ["fundamenta[semantic,claude,notebooks,dev]"]

[project.scripts]
fundamenta = "fundamenta.cli:main"

[project.urls]
Repository = "https://github.com/Andres-DLT/fundamenta-rag"

[tool.setuptools]
packages = ["fundamenta"]

[tool.setuptools.package-data]
fundamenta = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# En los notebooks se prioriza que los ejemplos se lean de un vistazo
"*.ipynb" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["semantic: requiere el extra [semantic] y descarga un modelo de embeddings"]
